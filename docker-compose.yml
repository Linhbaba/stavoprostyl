services:
  postgres:
    image: postgres:17-alpine
    container_name: stavoprostyl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stavoprostyl
      POSTGRES_USER: stavoprostyl
      POSTGRES_PASSWORD: stavoprostyl
    ports:
      - "5435:5432"
    volumes:
      - stavoprostyl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stavoprostyl"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stavoprostyl_pgdata:
